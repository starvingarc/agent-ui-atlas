skills:
- id: anthropic-frontend-design
  name: Anthropic Frontend Design
  roles:
    en:
    - UI generation
    zh:
    - UI 生成
  summary:
    en: Distinctive production-grade frontend design from a brief.
    zh: 根据需求生成有辨识度的生产级前端。
  url: https://github.com/anthropics/skills/tree/main/skills/frontend-design
- id: impeccable
  name: Impeccable
  roles:
    en:
    - Polish
    - critique
    zh:
    - 完善
    - 评审
  summary:
    en: Systematic critique, typography, spacing, motion and finishing passes.
    zh: 系统检查字体、间距、动效和最终完成度。
  url: https://github.com/pbakaus/impeccable
- id: hallmark
  name: Hallmark
  roles:
    en:
    - Audit
    - redesign
    zh:
    - 审查
    - 重设计
  summary:
    en: Anti-generic design rules for greenfield work and audits.
    zh: 为新界面和审查提供反模板化设计规则。
  url: https://github.com/Nutlope/hallmark
- id: ui-skills
  name: UI Skills
  roles:
    en:
    - Extraction
    - improvement
    zh:
    - 提取
    - 改进
  summary:
    en: Creates DESIGN.md files and improves interfaces against design evidence.
    zh: 创建 DESIGN.md，并依据设计证据改进界面。
  url: https://github.com/ibelick/ui-skills
- id: interface-design
  name: Interface Design
  roles:
    en:
    - Generation
    - consistency
    zh:
    - 生成
    - 一致性
  summary:
    en: Craft, memory and enforcement for coherent interface systems.
    zh: 通过设计记忆和约束保持界面系统一致。
  url: https://github.com/Dammyjay93/interface-design
- id: designer-skills
  name: Designer Skills
  roles:
    en:
    - Design process
    - implementation
    zh:
    - 设计流程
    - 实现
  summary:
    en: Structured design workflow from brief through review.
    zh: 从设计简报到评审的结构化工作流。
  url: https://github.com/julianoczkowski/designer-skills
- id: google-design-md
  name: Google DESIGN.md
  roles:
    en:
    - Design contract
    zh:
    - 设计契约
  summary:
    en: Persistent structured visual identity for coding agents.
    zh: 为编程 Agent 提供持久、结构化的视觉身份。
  url: https://github.com/google-labs-code/design.md
- id: stitch-skills
  name: Stitch Skills
  roles:
    en:
    - Variants
    - extraction
    zh:
    - 变体
    - 提取
  summary:
    en: Design variants, DESIGN.md extraction and UI conversion with Stitch.
    zh: 结合 Stitch 生成设计变体、提取规范并转换界面。
  url: https://github.com/google-labs-code/stitch-skills
- id: dembrandt
  name: Dembrandt
  roles:
    en:
    - Design extraction
    zh:
    - 设计提取
  summary:
    en: Extracts colors, typography, borders and tokens from websites.
    zh: 从网站提取颜色、字体、边框和设计令牌。
  url: https://github.com/dembrandt/dembrandt
- id: vercel-web-design-guidelines
  name: Vercel Web Design Guidelines
  roles:
    en:
    - UI audit
    zh:
    - UI 审查
  summary:
    en: Audits accessibility, performance, interaction and UX conventions.
    zh: 审查无障碍、性能、交互和用户体验规范。
  url: https://github.com/vercel-labs/agent-skills/tree/main/skills/web-design-guidelines
- id: github-premium-frontend
  name: GitHub Premium Frontend UI / Anti-UI-Slop
  roles:
    en:
    - Direction
    - audit
    zh:
    - 方向
    - 审查
  summary:
    en: Premium visual directions and checks against generic generated UI.
    zh: 提供高级视觉方向并检查模板化生成界面。
  url: https://github.com/github/awesome-copilot/tree/main/skills/premium-frontend-ui
- id: agentation
  name: Agentation
  roles:
    en:
    - Visual feedback
    zh:
    - 视觉反馈
  summary:
    en: Captures precise visual feedback that agents can act on.
    zh: 采集 Agent 可以直接执行的精确视觉反馈。
  url: https://github.com/benjitaylor/agentation
- id: taste-skill
  name: Taste Skill
  roles:
    en:
    - Aesthetic direction
    zh:
    - 审美方向
  summary:
    en: Opinionated aesthetic presets and anti-generic frontend direction.
    zh: 提供明确审美预设与反模板化前端方向。
  url: https://github.com/Leonxlnx/taste-skill
- id: lottiefiles-motion-design
  name: LottieFiles Motion Design Skill
  roles:
    en:
    - Motion direction
    zh:
    - 动效方向
  summary:
    en: Defines motion personality, timing and interaction behavior.
    zh: 定义动效个性、节奏和交互行为。
  url: https://github.com/LottieFiles/motion-design-skill
- id: gpt-image-2-skill
  name: GPT Image 2 Skill
  roles:
    en:
    - Image generation
    zh:
    - 图像生成
  summary:
    en: Produces art-directed image layers and technical visual assets.
    zh: 生成经过艺术指导的图像层和技术视觉素材。
  url: https://github.com/wuyoscar/GPT-Image2-Skill
